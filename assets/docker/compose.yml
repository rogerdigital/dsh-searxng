services:
  searxng:
    image: "${DSH_SEARXNG_IMAGE}"
    container_name: "${DSH_SEARXNG_CONTAINER}"
    restart: unless-stopped
    environment:
      FORCE_OWNERSHIP: "false"
    ports:
      - "127.0.0.1:${DSH_SEARXNG_PORT}:8080"
    labels:
      io.dsh-searxng.managed: "true"
      io.dsh-searxng.home-id: "${DSH_SEARXNG_HOME_ID}"
      io.dsh-searxng.schema: "1"
      io.dsh-searxng.deployment-version: "${DSH_SEARXNG_DEPLOYMENT_VERSION}"
    volumes:
      - type: bind
        source: "${DSH_SEARXNG_SETTINGS_DIR}"
        target: /etc/searxng
      - type: volume
        source: searxng-cache
        target: /var/cache/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks:
      - dsh-searxng

volumes:
  searxng-cache:
    name: "${DSH_SEARXNG_CACHE_VOLUME}"
    labels:
      io.dsh-searxng.managed: "true"
      io.dsh-searxng.home-id: "${DSH_SEARXNG_HOME_ID}"
      io.dsh-searxng.schema: "1"

networks:
  dsh-searxng:
    name: "${DSH_SEARXNG_NETWORK}"
    labels:
      io.dsh-searxng.managed: "true"
      io.dsh-searxng.home-id: "${DSH_SEARXNG_HOME_ID}"
      io.dsh-searxng.schema: "1"
